<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1B1B22"/>
      <stop offset="1" stop-color="#0B0B0E"/>
    </linearGradient>
    <pattern id="grain" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#D4FF3F" opacity="0.06"/>
      <circle cx="60" cy="60" r="1" fill="#D4FF3F" opacity="0.04"/>
      <circle cx="40" cy="10" r="0.5" fill="#F5F5F7" opacity="0.04"/>
      <circle cx="10" cy="50" r="0.5" fill="#F5F5F7" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grain)"/>
