services:
  postgres:
    image: postgres:17-alpine
    container_name: orbisedg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbisedg
      POSTGRES_PASSWORD: orbisedg
      POSTGRES_DB: orbisedg
    ports:
      - "5433:5432"
    volumes:
      - orbisedg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbisedg -d orbisedg"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orbisedg_postgres_data:
